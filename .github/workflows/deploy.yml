name: Deploy chats site

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The knowledge base is generated from the notes repo, so check it out
      # alongside and rebuild kb.json on every deploy. That way Bolo always
      # knows the chapters that are currently published.
      - uses: actions/checkout@v4
        with:
          repository: Hrtkk/bytescribble-notes
          path: .notes
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run kb
        env:
          NOTES_DIR: ${{ github.workspace }}/.notes/src/content/chapters
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
